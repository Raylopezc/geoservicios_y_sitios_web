
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visor geográfico de departamentos y municipios de Colombia">
    <title>Visor Geográfico de Colombia</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <div>
            <h1>Visor Geográfico de Colombia</h1>
            <p>Visualización de departamentos y municipios mediante servicios geográficos web</p>
        </div>
    </header>

    <main class="contenedor">

        <aside class="panel-lateral">

            <section class="panel">
                <h2>Capas geográficas</h2>

                <label>
                    <input type="checkbox" id="capaDepartamentos" checked>
                    Departamentos
                </label>

                <label>
                    <input type="checkbox" id="capaMunicipios">
                    Municipios
                </label>
            </section>

            <section class="panel">
                <h2>Información geográfica</h2>
                <div id="informacion">
                    Seleccione un departamento o municipio en el mapa.
                </div>
            </section>

            <section class="panel">
                <h2>Leyenda</h2>

                <div class="elemento-leyenda">
                    <span class="simbolo departamento"></span>
                    Departamentos
                </div>

                <div class="elemento-leyenda">
                    <span class="simbolo municipio"></span>
                    Municipios
                </div>
            </section>

        </aside>

        <section class="contenedor-mapa">
            <div id="mapa"></div>
        </section>

    </main>

    <footer>
        <p>Proyecto final - Servicios Web Geográficos | Colombia</p>
    </footer>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts de la aplicación -->
    <script src="js/servicios.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/consultas.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
